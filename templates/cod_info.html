<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>超商取貨付款資訊</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 700px; margin: auto; }
        .info-box { border: 1px solid #ccc; padding: 20px; border-radius: 10px; background: #f8f8f8; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px; border: 1px solid #ddd; }
        .important { color: red; font-weight: bold; }
        .btn { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>超商取貨付款資訊</h1>
    <div class="info-box">
        <table>
            <tr><td>訂單編號</td><td>{{ cod.merchant_trade_no }}</td></tr>
            <tr><td>商品名稱</td><td>{{ cod.item_name }}</td></tr>
            <tr><td>應付金額(取貨時付現)</td><td class="important">{{ cod.trade_amt }} 元</td></tr>
            <tr><td>取貨門市</td><td>{{ cod.store_name }}</td></tr>
            <tr><td>門市地址</td><td>{{ cod.store_address }}</td></tr>
            <tr><td>收件人</td><td>{{ cod.receiver_name }}</td></tr>
            <tr><td>訂單狀態</td><td>待出貨</td></tr>
        </table>
    </div>
	<script>
		function goBack() {
			if (history.length >= 2) {
				history.go(-2);
			} else {
				history.go(-1);
			}
		}
	</script>
    <button class="btn" onclick="window.parent.location.href='{{ HF_SPACE_E_COMMERCE_URL }}/commerce_shop/purchased_products/'">
        回商城
    </button>
	<button type="button" onclick="goBack()"> 返回 </button>
	<button type="button" onclick="history.back()">返回1</button>
</div>
</body>
</html>
